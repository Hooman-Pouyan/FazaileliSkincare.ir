services:
  postgres:
    image: postgres:16.9-alpine
    command: ["postgres", "-c", "timezone=UTC"]
    environment:
      POSTGRES_DB: fazaieli
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      POSTGRES_PASSWORD: fazaieli_local
      POSTGRES_USER: fazaieli
    ports:
      - name: postgres
        target: 5432
        published: "${FAZAIELI_DATABASE_PORT:-5432}"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fazaieli -d fazaieli"]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
