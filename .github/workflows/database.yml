name: Database

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  verify:
    name: PostgreSQL 16 from zero
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify database from zero
        run: pnpm db:verify
