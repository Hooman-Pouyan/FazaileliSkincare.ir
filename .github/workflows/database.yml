name: Database

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  verify:
    # 22 is what liara.json deploys and is therefore the gate. 24 is what the
    # maintainer develops on, so it is tested too — widening engines without
    # testing the wider range would move the drift rather than remove it.
    name: PostgreSQL 16 from zero (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify database from zero
        run: pnpm db:verify
